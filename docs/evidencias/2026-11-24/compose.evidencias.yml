name: backend-evidencias-isidora
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: evidencia
      POSTGRES_DB: backend_evidencias_test
      POSTGRES_PASSWORD: ${EVIDENCE_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - evidence_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidencia -d backend_evidencias_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    image: backend-evidencias-isidora:revision
    build:
      context: ./source
      dockerfile: dockerfile
      labels:
        org.opencontainers.image.revision: ${EVIDENCE_REVISION:?}
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: backend_evidencias_test
      DB_USER: evidencia
      DB_PASSWORD: ${EVIDENCE_DB_PASSWORD:?}
      JWT_SECRET_KEY: ${EVIDENCE_JWT_SECRET:?}
      RECOVERY_MAIL_DIR: /tmp/recovery-mail
    ports:
      - "127.0.0.1:8008:8000"
    depends_on:
      db:
        condition: service_healthy
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  evidence_data:
